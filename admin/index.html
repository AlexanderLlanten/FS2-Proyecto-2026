<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración | KYNEX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/main.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/components.css"
    >

</head>


<body>

    <main>

        <section class="page-header">

            <div class="container">

                <p class="section-eyebrow">
                    KYNEX ADMIN
                </p>

                <h1>
                    Administración
                </h1>

                <p>
                    Gestión interna de productos,
                    usuarios y contenidos de la plataforma.
                </p>

            </div>

        </section>


        <section class="section-spacing">

            <div class="container">

                <div class="row g-4">

                    <div class="col-md-6">

                        <article class="feature-card">

                            <div class="feature-icon">
                                <i class="bi bi-box-seam"></i>
                            </div>

                            <h2>
                                Productos
                            </h2>

                            <p>
                                Gestiona el catálogo de suplementos KYNEX.
                            </p>

                            <a
                                href="products/products.html"
                                class="feature-link"
                            >
                                Administrar productos

                                <i class="bi bi-arrow-right"></i>
                            </a>

                        </article>

                    </div>


                    <div class="col-md-6">

                        <article class="feature-card">

                            <div class="feature-icon">
                                <i class="bi bi-people"></i>
                            </div>

                            <h2>
                                Usuarios
                            </h2>

                            <p>
                                Gestiona los usuarios registrados
                                en la plataforma.
                            </p>

                            <a
                                href="users/users.html"
                                class="feature-link"
                            >
                                Administrar usuarios

                                <i class="bi bi-arrow-right"></i>
                            </a>

                        </article>

                    </div>

                </div>


                <div class="mt-5">

                    <a
                        href="../index.html"
                        class="btn btn-kynex-secondary"
                    >
                        <i class="bi bi-arrow-left"></i>

                        Volver a la tienda
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script
        src="../assets/js/app.js"
        defer
    ></script>

</body>

</html>
